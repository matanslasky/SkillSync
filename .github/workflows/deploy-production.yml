name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.3)'
        required: true
        type: string

jobs:
  deploy-production:
    name: Deploy to Firebase Hosting (Production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://skillsync-2dc94.firebaseapp.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        working-directory: ./client
        run: npm ci
      
      - name: Run tests
        working-directory: ./client
        run: |
          npm run test:unit
          npm run lint
      
      - name: Build application
        working-directory: ./client
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY_PROD }}
          VITE_APP_ENV: production
          VITE_APP_VERSION: ${{ github.event.inputs.version }}
          VITE_ENABLE_ERROR_TRACKING: true
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN_PROD }}
          VITE_SENTRY_ENVIRONMENT: production
      
      - name: Create release tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}
      
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: skillsync-2dc94
          entryPoint: ./client
      
      - name: Deploy Cloud Functions
        working-directory: ./functions
        run: |
          npm ci
          npx firebase-tools deploy --only functions --project skillsync-2dc94 --token ${{ secrets.FIREBASE_TOKEN }}
      
      - name: Run smoke tests
        working-directory: ./client
        run: |
          npm run test:smoke
        continue-on-error: true
        env:
          SMOKE_TEST_URL: https://skillsync-2dc94.firebaseapp.com
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: Release ${{ github.event.inputs.version }}
          body: |
            Production deployment of SkillSync ${{ github.event.inputs.version }}
            
            Deployed to: https://skillsync-2dc94.firebaseapp.com
          draft: false
          prerelease: false
      
      - name: Notify deployment
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          echo "Version: ${{ github.event.inputs.version }}"
          echo "URL: https://skillsync-2dc94.firebaseapp.com"
